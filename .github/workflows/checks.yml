name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the checks
        run: node checks.js
      - name: Rebuild the page
        run: python3 build.py
      - name: The committed page must be reproduced
        run: git diff --exit-code index.html
